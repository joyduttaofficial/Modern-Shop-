<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Background -->
  <rect width="500" height="500" fill="#ffffff" rx="16"/>

  <!-- Outer Red Octagon Border -->
  <polygon points="120,25 380,25 475,120 475,380 380,475 120,475 25,380 25,120"
           fill="#ffffff" stroke="#EF1C24" stroke-width="18" stroke-linejoin="round"/>

  <!-- Inner Blue Octagon Border -->
  <polygon points="135,46 365,46 454,135 454,365 365,454 135,454 46,365 46,135"
           fill="#ffffff" stroke="#0066FF" stroke-width="12" stroke-linejoin="round"/>

  <!-- Central Red "M" -->
  <path d="M 120,125 
           L 185,125 
           L 185,200 
           L 250,305 
           L 315,200 
           L 315,125 
           L 380,125 
           L 380,335 
           L 315,335 
           L 315,260 
           L 250,355 
           L 185,260 
           L 185,335 
           L 120,335 Z" 
        fill="#EF1C24"/>

  <!-- White Serif "C" on left pillar of M -->
  <text x="152" y="275" 
        font-family="'Times New Roman', Times, serif" 
        font-size="65" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">C</text>

  <!-- White Serif "S" on right pillar of M -->
  <text x="348" y="275" 
        font-family="'Times New Roman', Times, serif" 
        font-size="65" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">S</text>

  <!-- "Modern cloth store" text in Blue -->
  <text x="250" y="375" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="30" 
        font-weight="800" 
        fill="#0066FF" 
        letter-spacing="-0.5" 
        text-anchor="middle">Modern cloth store</text>

  <!-- "Since : 1983" text in Blue -->
  <text x="250" y="415" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="700" 
        fill="#0066FF" 
        letter-spacing="0.5" 
        text-anchor="middle">Since : 1983</text>
</svg>
